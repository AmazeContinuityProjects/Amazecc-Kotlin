# Gradle Performance Optimizations
# JDK is supplied by JAVA_HOME locally and by setup-java in CI; a machine-specific
# org.gradle.java.home here broke the Ubuntu release runner.
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache-problems=warn

# JVM Memory Settings (Fixes CI JVM Heap Exhaustion / OutOfMemory / GC Thrashing)
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseG1GC
kotlin.daemon.jvmargs=-Xmx2g
kotlin.compiler.execution.strategy=in-process

# Kotlin Multiplatform
kotlin.native.ignoreDisabledTargets=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
